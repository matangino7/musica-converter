<header class="header">
  <div class="container header-container">
    <div class="logo-container" (click)="navigateToHome()">
      <img src="assets/logo.svg" alt="Musica Converter Logo" class="logo">
    </div>
    
    <nav class="nav-menu">
      <ul class="nav-list">
        <li class="nav-item">
          <a routerLink="/about" class="nav-link">About Us</a>
        </li>
        <li class="nav-item">
          <a routerLink="/pricing" class="nav-link">Pricing</a>
        </li>
        <li class="nav-item" *ngIf="isLoggedIn">
          <a routerLink="/orders" class="nav-link">My Orders</a>
        </li>
      </ul>
    </nav>
    
    <div class="auth-buttons">
      <ng-container *ngIf="!isLoggedIn">
        <button class="btn btn-secondary mr-2" (click)="navigateToLogin()">Login</button>
        <button class="btn btn-primary" (click)="navigateToRegister()">Register</button>
      </ng-container>
      
      <ng-container *ngIf="isLoggedIn">
        <div class="user-menu">
          <span class="user-email">{{ userEmail }}</span>
          <button class="btn btn-secondary" (click)="logout()">Logout</button>
        </div>
      </ng-container>
    </div>
    
    <button class="mobile-menu-btn" (click)="toggleMobileMenu()">
      <span class="menu-icon"></span>
      <span class="menu-icon"></span>
      <span class="menu-icon"></span>
    </button>
  </div>
</header>

<!-- Mobile Menu -->
<div class="mobile-menu" [class.active]="isMobileMenuOpen">
  <div class="mobile-menu-header">
    <div class="logo-container" (click)="navigateToHome()">
      <img src="assets/logo.svg" alt="Musica Converter Logo" class="logo">
    </div>
    <button class="mobile-menu-close" (click)="toggleMobileMenu()">
      <i class="fas fa-times"></i>
    </button>
  </div>
  
  <ul class="mobile-menu-list">
    <li class="mobile-menu-item">
      <a routerLink="/about" class="mobile-menu-link" (click)="toggleMobileMenu()">About Us</a>
    </li>
    <li class="mobile-menu-item">
      <a routerLink="/pricing" class="mobile-menu-link" (click)="toggleMobileMenu()">Pricing</a>
    </li>
    <li class="mobile-menu-item" *ngIf="isLoggedIn">
      <a routerLink="/orders" class="mobile-menu-link" (click)="toggleMobileMenu()">My Orders</a>
    </li>
  </ul>
  
  <div class="mobile-menu-buttons">
    <ng-container *ngIf="!isLoggedIn">
      <button class="btn btn-secondary" (click)="navigateToLogin(); toggleMobileMenu()">Login</button>
      <button class="btn btn-primary" (click)="navigateToRegister(); toggleMobileMenu()">Register</button>
    </ng-container>
    
    <ng-container *ngIf="isLoggedIn">
      <div class="user-menu">
        <span class="user-email">{{ userEmail }}</span>
        <button class="btn btn-secondary" (click)="logout(); toggleMobileMenu()">Logout</button>
      </div>
    </ng-container>
  </div>
</div>
